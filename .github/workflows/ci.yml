name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS, not Linux: both targets import AppKit/SwiftUI, and the app tests
    # construct the real Store.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Package.swift needs Swift 6 tools. Printed so a runner image change that
      # breaks the build is visible at a glance.
      - name: Toolchain
        run: xcodebuild -version && swift --version

      # Kept as separate steps so a failure names which check broke.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The same packaging the release uses, ad-hoc signed, so a broken bundle
      # layout or plist is caught on the PR rather than after a release is cut.
      - name: Package app
        run: |
          bash Scripts/build-app.sh
          plutil -lint "dist/Lock In.app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "dist/Lock In.app"

      - name: Shell scripts parse
        run: for f in Scripts/*.sh install-app; do bash -n "$f"; done

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # setup-release.ts only runs on a maintainer's machine, so CI is the one place it's checked.
      - name: Release setup script checks
        run: deno check Scripts/setup-release.ts && deno lint Scripts/setup-release.ts && deno fmt --check Scripts/setup-release.ts
